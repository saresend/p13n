[package]
name = "dsys"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
diesel = { version = "2.2", features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.2", features = ["sqlite"] }
# Compile SQLite into the binary so releases have no libsqlite3 runtime dependency.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
actix-cors = "0.7"

[profile.release]
strip = true
lto = true
