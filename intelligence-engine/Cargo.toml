[package]
name = "intelligence-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.2"
actix-web = "4.17.0"
bytes = "1.12.1"
env_logger = "0.11.11"
futures-util = "0.3.34"
jsonschema = { version = "0.59.0", default-features = false }
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["sync", "time", "macros"] }

[dev-dependencies]
actix-rt = "2.15.0"
