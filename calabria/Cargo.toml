[package]
name = "calabria"
version = "0.1.0"
edition = "2024"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
web-sys = { version = "0.3", features = ["HtmlTextAreaElement", "HtmlInputElement", "CssStyleDeclaration"] }
gloo-storage = "0.4"
serde = { version = "1", features = ["derive"] }
js-sys = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"
serde_json = "1"
gloo-events = "0.2"
